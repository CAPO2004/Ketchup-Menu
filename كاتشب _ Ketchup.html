<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كاتشب | Ketchup</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#e30613;--red2:#a8000c;--bg:#fbf6f4;--card:#fff;--ink:#241113;--mut:#8a6c6e;--line:#f1dedb;--tile:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150a0b;--card:#211214;--ink:#fff1ef;--mut:#c9a5a6;--line:#38201f}}
:root[data-theme="dark"]{--bg:#150a0b;--card:#211214;--ink:#fff1ef;--mut:#c9a5a6;--line:#38201f}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:130px}
body{background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
svg{display:block}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--red) 94%,transparent);backdrop-filter:blur(10px);color:#fff}
header img{width:42px;height:42px;border-radius:50%;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
header b{flex:1;font-size:19px;font-weight:900;letter-spacing:.3px}
.cb{position:relative;background:#fff;color:var(--red);border:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.cb.bump{animation:bump .4s}
.cb i{position:absolute;top:-4px;inset-inline-start:-4px;min-width:20px;height:20px;border-radius:10px;background:#111;color:#fff;font:800 11px/20px Cairo;text-align:center;font-style:normal;padding:0 5px}
.hero{background:linear-gradient(150deg,var(--red) 20%,var(--red2));color:#fff;border-radius:0 0 36px 36px;padding:34px 18px 44px;overflow:hidden}
.hi{max-width:1000px;margin:auto;display:grid;gap:26px;align-items:center}
@media(min-width:760px){.hi{grid-template-columns:1.1fr 1fr}.hero{padding:56px 18px 64px}}
.hero small{display:inline-block;background:#ffffff26;padding:5px 14px;border-radius:99px;font-weight:700;font-size:13px;animation:up .7s both}
.hero h1{font-size:clamp(30px,7vw,50px);font-weight:900;line-height:1.25;margin:12px 0;animation:up .7s .1s both}
.hero p{opacity:.9;margin-bottom:20px;animation:up .7s .2s both}
.cta{display:inline-block;background:#fff;color:var(--red);font-weight:900;padding:13px 30px;border-radius:99px;text-decoration:none;animation:up .7s .3s both,pulse 2.4s 1.2s infinite}
.col{position:relative;height:210px}
@media(min-width:760px){.col{height:300px}}
.col img{position:absolute;border-radius:50%;object-fit:cover;border:5px solid #ffffff;box-shadow:0 14px 34px #0004;animation:float 6s ease-in-out infinite}
.col img:nth-child(1){width:46%;aspect-ratio:1;top:0;right:4%}
.col img:nth-child(2){width:38%;aspect-ratio:1;bottom:0;right:44%;animation-delay:-2s}
.col img:nth-child(3){width:34%;aspect-ratio:1;top:14%;left:2%;animation-delay:-4s}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px}
.bar{position:sticky;top:calc(62px + env(safe-area-inset-top,0px));z-index:15;background:var(--bg);padding:12px 0 6px}
.search{width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:11px 16px;font:600 15px Cairo;outline:0;transition:border .2s}
.search:focus{border-color:var(--red)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:4px 14px 4px 5px;border-radius:99px;font:700 13px Cairo;cursor:pointer;transition:.2s}
.chip img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.chip.on,.chip:hover{background:var(--red);color:#fff;border-color:var(--red)}
.sec{margin-top:26px}
.ban{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,var(--red),var(--red2));color:#fff;border-radius:22px;padding:12px 18px 12px 12px;margin-bottom:12px;box-shadow:0 8px 22px #e3061330}
.ban img{width:84px;height:68px;border-radius:16px;object-fit:cover;background:#fff;flex:none}
.ban h2{font-size:21px;font-weight:900;line-height:1.2}
.ban span{font-size:12px;opacity:.85}
.grid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.r{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 12px 11px 14px;opacity:0;transform:translateY(16px);transition:opacity .45s,transform .45s,border-color .2s}
.r.v{opacity:1;transform:none}
.r:hover{border-color:var(--red)}
.r b{font-weight:700;font-size:15px;line-height:1.35}
.pr{display:flex;gap:6px;flex:none}
.add{position:relative;border:0;background:#e3061314;color:var(--red);border-radius:12px;padding:7px 11px;font:800 13px Cairo;cursor:pointer;transition:transform .15s,background .2s,color .2s;white-space:nowrap}
.add:hover{background:var(--red);color:#fff}
.add:active{transform:scale(.9)}
.add em{font-style:normal;font-weight:600;font-size:11px;opacity:.8;margin-inline-end:4px}
.add[data-n]:not([data-n="0"]){background:var(--red);color:#fff}
.add[data-n]:not([data-n="0"])::after{content:attr(data-n);position:absolute;top:-7px;inset-inline-end:-5px;background:#111;color:#fff;border-radius:9px;min-width:18px;height:18px;font:800 10px/18px Cairo;text-align:center}
.note{background:var(--card);border:1px dashed var(--red);border-radius:14px;padding:9px 14px;font-size:13px;color:var(--mut);margin-bottom:8px}
.fab{position:fixed;inset-inline:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;background:#111;color:#fff;border:0;border-radius:20px;padding:13px 18px;font:800 15px Cairo;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 12px 30px #0006;transform:translateY(160%);transition:transform .45s cubic-bezier(.2,1.3,.4,1);max-width:560px;margin:auto}
.fab.s{transform:none}
.fab span{flex:1;text-align:start}
.fab b{background:var(--red);padding:5px 14px;border-radius:12px}
.ov{position:fixed;inset:0;background:#0008;z-index:40;opacity:0;pointer-events:none;transition:.3s}
.ov.o{opacity:1;pointer-events:auto}
.sh{position:fixed;inset-inline:0;bottom:0;z-index:50;background:var(--bg);border-radius:28px 28px 0 0;max-height:92%;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.9,.3,1);max-width:620px;margin:auto}
.sh.o{transform:none}
.sh h3{font-weight:900;font-size:20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.x{background:var(--line);border:0;width:34px;height:34px;border-radius:50%;font-size:16px;color:var(--ink);cursor:pointer}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:700}
.row span{flex:1}
.q{display:flex;align-items:center;gap:8px}
.q button{width:28px;height:28px;border-radius:50%;border:0;background:var(--red);color:#fff;font:900 16px Cairo;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-weight:900;font-size:19px;padding:14px 0}
.f input,.f select,.f textarea{width:100%;margin-bottom:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 14px;font:600 15px Cairo;outline:0}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--red)}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#25d366;color:#fff;text-decoration:none;border-radius:16px;padding:14px;font:900 17px Cairo;transition:transform .15s}
.go:active{transform:scale(.97)}
.er{color:var(--red);font-weight:700;font-size:13px;min-height:20px;margin-bottom:6px}
.cp{display:block;width:100%;margin-top:10px;background:none;border:0;color:var(--mut);font:600 13px Cairo;cursor:pointer;text-decoration:underline}
.em{text-align:center;color:var(--mut);padding:30px 0}
footer{text-align:center;color:var(--mut);font-size:13px;padding:34px 14px}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-14px)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes bump{40%{transform:scale(1.3)}}
@keyframes pop{from{transform:scale(0) rotate(-180deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.r{opacity:1;transform:none}}
</style>
</head>

const cats=[];

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("v");io.unobserve(e.target)}}),{threshold:.1});
function render(){
const q=$("q").value.trim();let h="";
cats.forEach((c,ci)=>{
const its=c.i.map((it,ii)=>({it,ii})).filter(x=>!q||x.it.n.includes(q)||c.n.includes(q));
if(!its.length)return;
h+=`<section class="sec" id="c${ci}"><div class="ban"><img src="${c.img}" alt=""><div><h2>${c.n}</h2><span>${its.length} صنف</span></div></div>`;

});
$("m").innerHTML=h||'<div class="em">مفيش نتايج</div>';
document.querySelectorAll(".r").forEach(e=>io.observe(e));
}
$("ch").innerHTML=cats.map((c,i)=>`<button class="chip" data-i="${i}"><img src="${c.img}" alt="">${c.n}</button>`).join("");
$("ch").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;$("q").value="";render();document.getElementById("c"+b.dataset.i).scrollIntoView();document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x==b))};
$("q").oninput=render;
const info=k=>{const[c,i,s]=k.split(".").map(Number),C=cats[c],I=C.i[i];return{name:I.n+(C.s[s]?` (${C.s[s]})`:""),price:I.p[s]}};
$("m").onclick=e=>{const b=e.target.closest(".add");if(!b)return;const k=b.dataset.k;cart[k]=(cart[k]||0)+1;upd(true)};
function upd(bump){

document.querySelectorAll(".add").forEach(b=>b.dataset.n=cart[b.dataset.k]||0);
if(bump){$("hc").classList.remove("bump");void $("hc").offsetWidth;$("hc").classList.add("bump")}
$("cl2").innerHTML=ks.length?ks.map(k=>{const x=info(k);return`<div class="row"><span>${x.name}</span><div class="q"><button data-k="${k}" data-d="1">+</button><b>${cart[k]}</b><button data-k="${k}" data-d="-1">−</button></div><b>${x.price*cart[k]}</b></div>`}).join(""):'<div class="em">السلة فاضية</div>';
}
$("cl2").onclick=e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.k;cart[k]+=+b.dataset.d;if(cart[k]<=0)delete cart[k];upd()};
const open=o=>{$("sh").classList.toggle("o",o);$("ov").classList.toggle("o",o)};
$("fab").onclick=$("hc").onclick=()=>open(true);$("cl").onclick=$("ov").onclick=()=>open(false);
$("ty").onchange=()=>{$("ad").style.display=$("ty").value=="توصيل"?"":"none"};
function build(){
const ks=Object.keys(cart);
if(!ks.length)return $("er").textContent="ضيف أصناف الأول",null;
const nm=$("nm").value.trim(),ph=$("ph").value.trim(),ad=$("ad").value.trim(),del=$("ty").value=="توصيل";
if(!nm||!ph||(del&&!ad))return $("er").textContent="من فضلك اكتب الاسم ورقم الموبايل"+(del?" والعنوان":""),null;
$("er").textContent="";
let t=0;
const lines=ks.map(k=>{const x=info(k),s=x.price*cart[k];t+=s;return`▪️ ${cart[k]}× ${x.name} = ${s} ج`}).join("\n");
return`*طلب جديد - كاتشب*\n\nالاسم: ${nm}\nالموبايل: ${ph}\nالنوع: ${$("ty").value}\n`+(del?`العنوان: ${ad}\n`:"")+`\n*الطلب:*\n${lines}\n\n*الإجمالي: ${t} ج*`+($("nt").value.trim()?`\nملاحظات: ${$("nt").value.trim()}`:"")+`\nالدفع: كاش عند الاستلام`;
}
$("go").onclick=e=>{const m=build();if(!m){e.preventDefault();return}$("go").href=`https://wa.me/${WA}?text=${encodeURIComponent(m)}`};
$("cp").onclick=async()=>{const m=build();if(!m)return;try{await navigator.clipboard.writeText(m);$("er").textContent="تم النسخ، ابعته على 01090204281"}catch(e){$("er").textContent="النسخ مش متاح، استخدم زر الواتساب"}};
render();upd();
</script>
</body>
